[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscanner"
version = "3.1.0"
description = "Modular, non-destructive web security & posture assessment platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
